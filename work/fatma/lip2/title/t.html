<!doctype html><html><head><meta charset="utf-8"><style>

<div class="st" id="s1">

 <svg width="70" height="44" viewBox="0 0 52 32" fill="none" stroke="#F0C98A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 2px 6px rgba(74,42,20,.6))"><path d="M3 16 C8 7 15 4 20 9 C23 6 29 6 32 9 C37 4 44 7 49 16"/><path d="M3 16 Q26 21 49 16"/><path d="M3 16 C11 30 41 30 49 16"/></svg>
