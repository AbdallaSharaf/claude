html,body{margin:0;background:transparent}
.st{position:relative;width:1080px;height:1920px;overflow:hidden}
:root{--ink:#3A1219;--ink2:rgba(58,18,25,.55);--acc:#B4525E;--glass:rgba(250,242,236,.74);--hair:rgba(255,248,242,.85)}
.glass{position:absolute;background:var(--glass);border:1.5px solid var(--hair);box-shadow:0 1px 0 rgba(255,250,246,.9) inset,0 2px 6px rgba(70,20,28,.10),0 28px 70px rgba(70,20,28,.22)}
.f{font-family:G7;color:var(--ink);letter-spacing:-.02em}
.ico{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.key{position:absolute;border:1.5px solid rgba(58,18,25,.18);border-radius:12px;font:600 30px/1 G5;color:var(--ink2);padding:10px 14px;background:rgba(255,250,246,.6)}
.row{position:absolute;left:28px;right:28px;height:104px;border-radius:24px;display:flex;align-items:center;gap:26px;padding:0 30px;box-sizing:border-box}
.row .t{font:700 50px/1 G7;color:var(--ink);letter-spacing:-.02em}
.row .d{width:52px;height:52px;border-radius:16px;background:rgba(180,82,94,.12);display:flex;align-items:center;justify-content:center}
.sel{background:rgba(180,82,94,.16)}
.cur{position:absolute;width:52px;height:64px;filter:drop-shadow(0 6px 10px rgba(40,10,15,.35))}
</style></head><body>
