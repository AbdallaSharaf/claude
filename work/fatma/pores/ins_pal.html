<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G5;src:url(fonts/Geist600.woff2)}
@font-face{font-family:G7;src:url(fonts/Geist700.woff2)}
@font-face{font-family:P7;src:url(fonts/IBMPA700.ttf)}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
#shape{position:absolute;box-sizing:border-box;border:1.5px solid rgba(255,248,242,.85);background:rgba(250,242,236,.76);box-shadow:0 1px 0 rgba(255,250,246,.9) inset,0 2px 6px rgba(70,20,28,.10),0 28px 70px rgba(50,14,20,.24)}
.ab{position:absolute}
.big{font:700 66px/1 G7;color:#3A1219;letter-spacing:-.02em;white-space:nowrap}
.row{position:absolute;height:116px;border-radius:26px;display:flex;align-items:center;gap:28px;padding:0 32px;box-sizing:border-box;direction:ltr}
.row .t{font:700 58px/1 G7;letter-spacing:-.02em;white-space:nowrap;display:flex;gap:16px;align-items:baseline}
.row .t .ar{font:700 50px/1 P7}
.dk{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.key{border:1.5px solid rgba(58,18,25,.18);border-radius:12px;font:600 30px/1 G5;color:rgba(58,18,25,.55);padding:10px 14px;background:rgba(255,250,246,.6);white-space:nowrap}
#cur{position:absolute;left:0;top:0;width:52px;height:64px;transform-origin:5px 5px;filter:drop-shadow(0 6px 10px rgba(40,10,15,.35))}
</style></head><body><div id="st"><div id="cam">
<div id="shape"></div>
<div id="g" class="ab" style="left:0;top:0;width:1080px;height:1920px">
 <svg class="ab" id="mag" width="64" height="64" viewBox="0 0 60 60"><circle cx="26" cy="26" r="16" stroke="#3A1219" stroke-width="3.5" fill="none"/><path d="M38 38 L50 50" stroke="#3A1219" stroke-width="3.5" stroke-linecap="round"/></svg>
 <div class="ab big" id="q"><span id="qt"></span><span id="caret" style="display:inline-block;width:4px;height:60px;background:#B4525E;vertical-align:-8px;margin-left:4px"></span></div>
 <div class="ab key" id="kk">⌘K</div>
 <div class="ab" id="div" style="height:1.5px;background:rgba(58,18,25,.10)"></div>
 <div class="ab" id="ind" style="border-radius:26px;background:rgba(180,82,94,.16)"></div>
 <div id="rows"></div>
</div>
<svg id="cur" viewBox="0 0 52 64"><path d="M5 5 L5 50 L16 39 L24 57 L32 54 L24 36 L41 36 Z" fill="#2A0E13" stroke="#FAF2EC" stroke-width="3" stroke-linejoin="round"/></svg>
</div></div>
<script>
const D=DATA, pre=3/25;
function spr(t,Ts){ if(t<=0) return 0; const z=0.82,w=4/(z*Ts),wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function spx(t,Ts){ if(t<=0) return 0; const w=5.8/Ts; return 1-(1+w*t)*Math.exp(-w*t); }
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), $=id=>document.getElementById(id);
function trk(K,t,Ts){ let v=K[0][1]; for(let i=1;i<K.length;i++) v+=(K[i][1]-K[i-1][1])*spr(t-K[i][0],K[i][2]||Ts); return v; }
const O=D.open, C=D.close, CY=D.cy, W=D.w, RH=128, HEAD=170;
function box(e,x,y,w,h){ e.style.left=x.toFixed(1)+'px'; e.style.top=y.toFixed(1)+'px'; if(w!=null) e.style.width=Math.max(0,w).toFixed(1)+'px'; if(h!=null) e.style.height=Math.max(0,h).toFixed(1)+'px'; }
function press(t){ let p=0; D.clicks.forEach(([a,b])=>{ p+=spr(t-a,.10)-spr(t-b,.14); }); return cl(p,0,1); }
const CHK='<svg width="34" height="34" viewBox="0 0 32 32"><path d="M8 17 L14 23 L25 10" stroke="#3A1219" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DOT='<svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" stroke="#FAF2EC" stroke-width="3.5" fill="none"/></svg>';
const RW=D.rows.map(r=>{ const e=document.createElement('div'); e.className='row';
  e.innerHTML=`<div class="dk"></div><div class="t">${r.ar?`<span>${r.w}</span><span class="ar">${r.ar}</span>`:`<span>${r.w}</span>`}</div><div class="key" style="margin-left:auto">↵</div>`;
  $('rows').appendChild(e); return {e,r,dk:e.children[0],tx:e.children[1],key:e.children[2]}; });
const PH=n=>HEAD+n*RH+28;
const HK=[[0,20],[O+.02,PH(1)]].concat(D.rows.slice(1).map((r,i)=>[r.t-pre-0.22,PH(i+2)]));
function seek(t){
  const hv=(t<O-0.04||t>D.end)?'hidden':'visible'; $('cam').style.visibility=hv;
  const u=Math.max(0,Math.min(t,C)-O); $('cam').style.transform=`translate(${(4*Math.sin(u*.7)).toFixed(2)}px,${(5*Math.sin(u*.9)).toFixed(2)}px) scale(${(1+0.004*u).toFixed(4)})`;
  const k=spx(t-C,.32), g=spr(t-(O+.02),.42);
  const w=(20+(W-20)*g)*(1-k)+20*k, h=trk(HK,t,.40)*(1-k)+20*k, r=Math.min(20+36*g,h/2,w/2);
  const y=t>C? CY+(D.y1-CY)*spx(t-(C+.12),.32) : D.y0+(CY-D.y0)*spr(t-(O+0.02),.45);
  const S=$('shape'), pz=1-0.012*press(t); box(S,540-w*pz/2,y-h*pz/2,w*pz,h*pz); S.style.borderRadius=r.toFixed(1)+'px';
  S.style.opacity=(t>C+0.45? Math.max(0,1-(t-C-0.45)/0.15):1).toFixed(3);
  const top=y-h/2, L=540-W/2;
  const a=cl(spr(t-(O+0.18),.22),0,1), x=cl(spx(t-(C-0.02),.16),0,1), G=$('g'), op=a*(1-x);
  G.style.opacity=op.toFixed(3); G.style.filter=`blur(${((1-a)*8+x*8).toFixed(2)}px)`; G.style.visibility=op>0.002?'visible':'hidden';
  if(op>0.002){
    box($('mag'),L+48,top+50); box($('q'),L+136,top+46); box($('kk'),L+W-130,top+58); box($('div'),L,top+156,W,null);
    // query: the item she is saying, typed on her timing
    let cur=-1; D.rows.forEach((r,i)=>{ if(t>=r.t-pre) cur=i; });
    let qs=''; if(cur>=0){ const r=D.rows[cur]; qs=r.w.slice(0,Math.round(r.w.length*cl((t-(r.t-pre))/r.typ,0,1))); }
    $('qt').textContent=qs; $('caret').style.opacity=(Math.floor(t*2.2)%2==0)?1:0.2;
    RW.forEach((o,i)=>{ const ry=top+HEAD+i*RH; box(o.e,L+28,ry,W-56,116);
      const aa=cl(spr(t-(o.r.t-pre),.28),0,1); o.e.style.opacity=aa; o.e.style.transform=`translateY(${((1-aa)*24).toFixed(1)}px)`; o.e.style.filter=`blur(${((1-aa)*6).toFixed(2)}px)`;
      const on=i==cur; o.tx.style.color=on?'#3A1219':'rgba(58,18,25,.62)'; o.dk.innerHTML=on?DOT:CHK; o.dk.style.background=on?'#B4525E':'rgba(180,82,94,.12)'; o.key.style.opacity=on?1:0; });
    // liquid selection: moving down, the bottom edge leads and the top edge trails
    const a0=cl(spr(t-(D.rows[0].t-pre),.25),0,1); let tt=top+HEAD, bb=tt+116;
    for(let i=1;i<D.rows.length;i++){ const s=D.rows[i].t-pre; tt+=RH*spr(t-s,.34); bb+=RH*spr(t-s,.20); }
    box($('ind'),L+28+(W/2-28)*(1-a0),tt,(W-56)*a0,bb-tt); }
  const cx=trk(D.cx,t,.38), cy=trk(D.cy2,t,.38), cu=$('cur'); cu.style.visibility=(t>D.curIn&&t<D.curOut)?'visible':'hidden';
  cu.style.transform=`translate(${(cx-5).toFixed(1)}px,${(cy-5).toFixed(1)}px) scale(${(1-0.14*press(t)).toFixed(3)})`;
}
window.seek=seek;
</script></body></html>
