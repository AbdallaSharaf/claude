<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G5;src:url(fonts/Geist600.woff2)}
@font-face{font-family:G7;src:url(fonts/Geist700.woff2)}
@font-face{font-family:P7;src:url(fonts/IBMPA700.ttf)}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
#shape{position:absolute;box-sizing:border-box;border-style:solid;border-width:1.5px}
.g{position:absolute;left:0;top:0;width:1080px;height:1920px}
.ab{position:absolute}
.big{font:700 68px/1 G7;color:#3A1219;letter-spacing:-.02em;white-space:nowrap}
.row{position:absolute;height:104px;border-radius:24px;display:flex;align-items:center;gap:26px;padding:0 30px;box-sizing:border-box;direction:ltr}
.row .t{font:700 50px/1 G7;letter-spacing:-.02em;white-space:nowrap}
.dk{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.key{border:1.5px solid rgba(58,18,25,.18);border-radius:12px;font:600 30px/1 G5;color:rgba(58,18,25,.55);padding:10px 14px;background:rgba(255,250,246,.6);white-space:nowrap}
#cur{position:absolute;left:0;top:0;width:52px;height:64px;transform-origin:5px 5px;filter:drop-shadow(0 6px 10px rgba(40,10,15,.35))}
</style></head><body><div id="st"><div id="cam">
<div id="shape"></div>
<!-- S1 button -->
<div class="g" id="g1"><div class="ab big" id="b1" style="display:flex;align-items:center;gap:28px">
 <svg id="spin" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" stroke="rgba(180,82,94,.25)" stroke-width="5" fill="none"/><path id="arc" d="M32 6 A26 26 0 0 1 58 32" stroke="#B4525E" stroke-width="5" fill="none" stroke-linecap="round"/><path id="chk1" d="M18 33 L28 43 L47 22" stroke="#B4525E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <span id="w1">Skin Boosters</span></div></div>
<!-- S2 island -->
<div class="g" id="g2">
 <div class="ab" id="i2c" style="width:140px;height:140px;border-radius:70px;background:rgba(180,82,94,.92);display:flex;align-items:center;justify-content:center">
  <svg width="64" height="64" viewBox="0 0 64 64"><path id="chk2" d="M16 33 L27 44 L48 21" stroke="#FAF2EC" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="ab" id="i2s" style="font:600 32px/1 G5;color:rgba(250,242,236,.6);letter-spacing:.01em;white-space:nowrap">Skin Boosters</div>
 <div class="ab" id="i2m" style="font:700 74px/1 G7;color:#FAF2EC;letter-spacing:-.02em;white-space:nowrap">Mesobotox</div>
 <svg class="ab" id="bars" width="60" height="60" viewBox="0 0 60 60"><g stroke="#B4525E" stroke-width="5" stroke-linecap="round"><path id="br0"/><path id="br1"/><path id="br2"/><path id="br3"/></g></svg>
</div>
<!-- S3 palette -->
<div class="g" id="g3">
 <svg class="ab" id="mag" width="60" height="60" viewBox="0 0 60 60"><circle cx="26" cy="26" r="16" stroke="#3A1219" stroke-width="3.5" fill="none"/><path d="M38 38 L50 50" stroke="#3A1219" stroke-width="3.5" stroke-linecap="round"/></svg>
 <div class="ab big" id="q" style="font-size:64px"><span id="qt"></span><span id="caret" style="display:inline-block;width:4px;height:60px;background:#B4525E;vertical-align:-8px;margin-left:4px"></span></div>
 <div class="ab key" id="kk">⌘K</div>
 <div class="ab" id="div" style="height:1.5px;background:rgba(58,18,25,.10)"></div>
 <div class="ab" id="ind" style="border-radius:24px;background:rgba(180,82,94,.16)"></div>
 <div id="rows"></div>
</div>
<!-- S4 toast -->
<div class="g" id="g4">
 <div class="ab" id="t4c" style="width:110px;height:110px;border-radius:32px;background:#B4525E;display:flex;align-items:center;justify-content:center">
  <svg width="56" height="56" viewBox="0 0 56 56"><path id="chk4" d="M14 29 L24 39 L43 18" stroke="#FAF2EC" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="ab" id="t4t" style="display:flex;gap:16px;align-items:baseline;direction:rtl;white-space:nowrap"><span id="t4w" style="font:700 46px/1 P7;color:#3A1219">و</span><span id="t4m" style="font:700 66px/1 G7;color:#3A1219;letter-spacing:-.02em">Microneedling RF</span></div>
 <div class="ab" id="dots" style="display:flex;gap:10px"></div>
</div>
<svg id="cur" viewBox="0 0 52 64"><path d="M5 5 L5 50 L16 39 L24 57 L32 54 L24 36 L41 36 Z" fill="#2A0E13" stroke="#FAF2EC" stroke-width="3" stroke-linejoin="round"/></svg>
</div></div>
<script>
const D={"open": 23.0, "close": 27.66, "end": 28.41, "cy": 900, "y0": 1040, "y1": 1060, "T": {"check": 23.5, "island": 23.6, "pal": 24.36, "derm": 25.42, "toast": 26.0}, "wSB": 23.3, "wMeso": 23.68, "wWa": 26.02, "wMRF": 26.08, "click1": 23.2, "derm0": 25.42, "type1": [24.46, 25.15], "type2": [25.42, 25.85], "rows": [{"w": "Skin Boosters", "t": 24.48}, {"w": "Mesobotox", "t": 24.54}, {"w": "Fractional Laser", "t": 24.62}, {"w": "Dermapen", "t": 25.48}], "clicks": [[23.17, 23.25], [25.95, 26.03]], "cx": [[0, 1180], [22.95, 720], [23.75, 960], [24.4, 800], [25.3, 820], [26.1, 880], [27.1, 1180]], "cy2": [[0, 1500], [22.95, 935], [23.75, 1060], [24.4, 1095], [25.3, 1150], [26.1, 960], [27.1, 1500]], "curIn": 22.98, "curOut": 27.3}, pre=3/25;
function spr(t,Ts){ if(t<=0) return 0; const z=0.82,w=4/(z*Ts),wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function spx(t,Ts){ if(t<=0) return 0; const w=5.8/Ts; return 1-(1+w*t)*Math.exp(-w*t); }
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), $=id=>document.getElementById(id), lerp=(a,b,u)=>a+(b-a)*u;
function trk(K,t,Ts){ let v=K[0][1]; for(let i=1;i<K.length;i++) v+=(K[i][1]-K[i-1][1])*spr(t-K[i][0],K[i][2]||Ts); return v; }
const O=D.open, C=D.close, CY=D.cy, T=D.T;
function box(e,x,y,w,h){ e.style.left=x.toFixed(1)+'px'; e.style.top=y.toFixed(1)+'px'; if(w!=null) e.style.width=Math.max(0,w).toFixed(1)+'px'; if(h!=null) e.style.height=Math.max(0,h).toFixed(1)+'px'; }
function grp(id,te,tx,t){ const a=cl(spr(t-te,.22),0,1), x=cl(spx(t-tx,.16),0,1), e=$(id), op=a*(1-x); e.style.opacity=op.toFixed(3); e.style.filter=`blur(${((1-a)*8+x*8).toFixed(2)}px)`; e.style.visibility=op>0.002?'visible':'hidden'; return op>0.002; }
function rise(e,tw,t,dy){ const a=cl(spr(t-(tw-pre),.28),0,1.05); e.style.transform=`translateY(${((1-a)*(dy||24)).toFixed(1)}px)`; e.style.opacity=cl(a,0,1).toFixed(3); e.style.filter=`blur(${(Math.max(0,1-a)*6).toFixed(2)}px)`; }
function draw(path,t,t0,Ts){ const L=path.getTotalLength(), s=cl(spr(t-t0,Ts||.3),0,1); path.style.strokeDasharray=`${(L*s).toFixed(1)} ${L+1}`; path.style.opacity=s>0.003?1:0; }
function press(t){ let p=0; D.clicks.forEach(([a,b])=>{ p+=spr(t-a,.10)-spr(t-b,.14); }); return cl(p,0,1); }
// palette rows (the things she already said stay listed)
const RW=D.rows.map((r,i)=>{ const e=document.createElement('div'); e.className='row'; e.innerHTML=`<div class="dk"></div><div class="t">${r.w}</div><div class="key" style="margin-left:auto">↵</div>`; $('rows').appendChild(e); return {e,r,dk:e.children[0],tx:e.children[1],key:e.children[2]}; });
const CHK='<svg width="32" height="32" viewBox="0 0 32 32"><path d="M8 17 L14 23 L25 10" stroke="#3A1219" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DOT='<svg width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" stroke="#FAF2EC" stroke-width="3.5" fill="none"/></svg>';
for(let i=0;i<5;i++){ const s=document.createElement('span'); s.style.cssText='width:64px;height:8px;border-radius:4px;background:rgba(58,18,25,.18)'; $('dots').appendChild(s); }
// the one shape: size / radius / fill per state
const PH=n=>170+n*114+30;
const SW=[[0,20],[O+.02,780],[T.island,840],[T.pal,920],[T.toast,860]], SH=[[0,20],[O+.02,180],[T.island,200],[T.pal,PH(3)],[T.derm-0.22,PH(4)],[T.toast,190]], SR=[[0,10],[O+.02,90],[T.island,100],[T.pal,52],[T.toast,44]];
function seek(t){
  const hv=(t<O-0.04||t>D.end)?'hidden':'visible'; $('cam').style.visibility=hv;
  const u=Math.max(0,Math.min(t,C)-O); $('cam').style.transform=`translate(${(4*Math.sin(u*.7)).toFixed(2)}px,${(5*Math.sin(u*.9)).toFixed(2)}px) scale(${(1+0.004*u).toFixed(4)})`;
  const k=spx(t-C,.32);
  const w=trk(SW,t,.42)*(1-k)+20*k, h=trk(SH,t,.40)*(1-k)+20*k, r=Math.min(trk(SR,t,.42),h/2,w/2);
  const y=t>C? CY+(D.y1-CY)*spx(t-(C+.12),.32) : (t<O+0.02? D.y0 : D.y0+(CY-D.y0)*spr(t-(O+0.02),.45));
  const dk=cl(spr(t-T.island,.30)-spr(t-T.pal,.30),0,1);   // island turns dark, palette back to glass
  const S=$('shape'), pz=1-0.015*press(t); box(S,540-w*pz/2,y-h*pz/2,w*pz,h*pz); S.style.borderRadius=r.toFixed(1)+'px';
  S.style.background=`rgba(${lerp(250,42,dk).toFixed(0)},${lerp(242,14,dk).toFixed(0)},${lerp(236,19,dk).toFixed(0)},${lerp(.74,.88,dk).toFixed(3)})`;
  S.style.borderColor=`rgba(255,248,242,${(0.85*(1-dk)).toFixed(3)})`;
  S.style.boxShadow=`0 1px 0 rgba(255,250,246,${(0.9*(1-dk)).toFixed(2)}) inset,0 2px 6px rgba(70,20,28,.10),0 28px 70px rgba(50,14,20,${lerp(.22,.35,dk).toFixed(2)})`;
  S.style.opacity=(t>C+0.45? Math.max(0,1-(t-C-0.45)/0.15):1).toFixed(3);
  const top=y-h/2;
  // S1 button + loader -> check
  if(grp('g1',O+0.22,T.island-0.05,t)){ const b=$('b1'); const bw=b.offsetWidth; box(b,540-bw/2,y-34); rise($('w1'),D.wSB,t);
    const sp=cl(spr(t-D.click1,.2),0,1)*(1-cl(spr(t-T.check,.15),0,1)); $('arc').style.opacity=sp.toFixed(3); $('arc').setAttribute('transform',`rotate(${((t-D.click1)*520).toFixed(1)} 32 32)`);
    draw($('chk1'),t,T.check,.25); }
  // S2 island
  if(grp('g2',T.island+0.06,T.pal-0.05,t)){ const L=540-w/2; box($('i2c'),L+30,y-70); draw($('chk2'),t,T.island+0.1,.3);
    box($('i2s'),L+200,y-58); box($('i2m'),L+200,y-14); rise($('i2m'),D.wMeso,t,30);
    const R=540+w/2; box($('bars'),R-110,y-30); [12,24,36,48].forEach((x,i)=>{ const hh=6+10*Math.abs(Math.sin(t*7+i*1.3)); $('br'+i).setAttribute('d',`M${x} ${30-hh} V${30+hh}`); }); }
  // S3 command palette: typing, results, liquid selection
  if(grp('g3',T.pal+0.06,T.toast-0.05,t)){ const L=540-460;
    box($('mag'),L+50,top+46); box($('q'),L+130,top+40); box($('kk'),L+800,top+52); box($('div'),L,top+150,920,null);
    const typ=(s,a,b)=>s.slice(0,Math.round(s.length*cl((t-a)/(b-a),0,1)));
    let qs=t<D.derm0? typ(D.rows[2].w,D.type1[0],D.type1[1]) : typ(D.rows[3].w,D.type2[0],D.type2[1]); $('qt').textContent=qs;
    $('caret').style.opacity=(Math.floor(t*2.2)%2==0||Math.abs(t-D.type1[1])<.4)?1:0.15;
    RW.forEach((o,i)=>{ const ry=top+170+i*114; box(o.e,L+28,ry,864,104); const ta=o.r.t;
      const a=cl(spr(t-(ta-pre),.28),0,1); o.e.style.opacity=a; o.e.style.transform=`translateY(${((1-a)*24).toFixed(1)}px)`; o.e.style.filter=`blur(${((1-a)*6).toFixed(2)}px)`;
      const cur=(i==2&&t<D.derm0)||(i==3&&t>=D.derm0); const done=i<2||(i==2&&t>=D.derm0);
      o.tx.style.color=cur?'#3A1219':'rgba(58,18,25,.55)'; o.dk.innerHTML=cur?DOT:CHK; o.dk.style.background=cur?'#B4525E':'rgba(180,82,94,.12)'; o.key.style.opacity=cur?1:0; });
    // indicator: row 2 -> row 3, leading (bottom) edge ahead of the trailing (top) edge
    const a0=cl(spr(t-(D.rows[2].t-pre),.25),0,1); let tt=top+170+2*114, bb=tt+104; const s1=spr(t-D.derm0,.20), s2=spr(t-D.derm0,.34); tt+=114*s2; bb+=114*s1;
    box($('ind'),L+28+432*(1-a0),tt,864*a0,bb-tt); }
  // S4 toast
  if(grp('g4',T.toast+0.06,C-0.02,t)){ const L=540-w/2; box($('t4c'),L+40,y-55); draw($('chk4'),t,T.toast+0.12,.3);
    const tt=$('t4t'); box(tt,L+180,y-48); rise($('t4w'),D.wWa,t); rise($('t4m'),D.wMRF,t);
    box($('dots'),L+180,y+36); [...$('dots').children].forEach((s,i)=>{ const a=cl(spr(t-(T.toast+0.15+i*0.07),.2),0,1); s.style.background=i==4?`rgba(180,82,94,${a})`:'rgba(58,18,25,.18)'; s.style.transform=`scaleX(${(0.3+0.7*a).toFixed(3)})`; }); }
  const cx=trk(D.cx,t,.38), cy=trk(D.cy2,t,.38), cu=$('cur'); cu.style.visibility=(t>D.curIn&&t<D.curOut)?'visible':'hidden';
  cu.style.transform=`translate(${(cx-5).toFixed(1)}px,${(cy-5).toFixed(1)}px) scale(${(1-0.14*press(t)).toFixed(3)})`;
}
window.seek=seek;
</script></body></html>
