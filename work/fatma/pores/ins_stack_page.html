<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G5;src:url(fonts/Geist600.woff2)}
@font-face{font-family:G7;src:url(fonts/Geist700.woff2)}
@font-face{font-family:P7;src:url(fonts/IBMPA700.ttf)}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.it{position:absolute;box-sizing:border-box;display:flex;align-items:center;gap:26px;padding:0 34px;direction:ltr;overflow:hidden}
.glass{background:rgba(250,242,236,.76);border:1.5px solid rgba(255,248,242,.85);box-shadow:0 1px 0 rgba(255,250,246,.9) inset,0 2px 6px rgba(70,20,28,.10),0 24px 60px rgba(50,14,20,.24)}
.dark{background:rgba(42,14,19,.88);box-shadow:0 24px 60px rgba(40,10,15,.35)}
.tx{font:700 60px/1 G7;color:#3A1219;letter-spacing:-.02em;white-space:nowrap}
.key{border:1.5px solid rgba(58,18,25,.18);border-radius:12px;font:600 30px/1 G5;color:rgba(58,18,25,.55);padding:10px 14px;background:rgba(255,250,246,.6);white-space:nowrap}
.c{display:flex;align-items:center;gap:26px;width:100%}
#cur{position:absolute;left:0;top:0;width:52px;height:64px;transform-origin:5px 5px;filter:drop-shadow(0 6px 10px rgba(40,10,15,.35))}
</style></head><body><div id="st"><div id="cam">
<!-- 1 button + loader -> check -->
<div class="it glass" id="i0"><div class="c" style="justify-content:center">
 <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" stroke="rgba(180,82,94,.25)" stroke-width="5" fill="none"/><path id="arc" d="M32 6 A26 26 0 0 1 58 32" stroke="#B4525E" stroke-width="5" fill="none" stroke-linecap="round"/><path id="ck0" d="M18 33 L28 43 L47 22" stroke="#B4525E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <span class="tx" id="w0">Skin Boosters</span></div></div>
<!-- 2 dynamic island -->
<div class="it dark" id="i1"><div class="c">
 <div style="width:96px;height:96px;border-radius:48px;background:#B4525E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="52" height="52" viewBox="0 0 64 64"><path id="ck1" d="M16 33 L27 44 L48 21" stroke="#FAF2EC" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <span class="tx" id="w1" style="color:#FAF2EC">Mesobotox</span>
 <svg width="60" height="60" viewBox="0 0 60 60" style="margin-left:auto"><g stroke="#B4525E" stroke-width="5" stroke-linecap="round"><path id="b0"/><path id="b1"/><path id="b2"/><path id="b3"/></g></svg></div></div>
<!-- 3 search field typing -->
<div class="it glass" id="i2"><div class="c">
 <svg width="60" height="60" viewBox="0 0 60 60" style="flex:none"><circle cx="26" cy="26" r="16" stroke="#3A1219" stroke-width="3.5" fill="none"/><path d="M38 38 L50 50" stroke="#3A1219" stroke-width="3.5" stroke-linecap="round"/></svg>
 <span class="tx" id="w2"><span id="qt"></span><span id="caret" style="display:inline-block;width:4px;height:58px;background:#B4525E;vertical-align:-8px;margin-left:4px"></span></span>
 <span class="key" style="margin-left:auto">⌘K</span></div></div>
<!-- 4 selected result row -->
<div class="it glass" id="i3"><div class="c">
 <div style="width:64px;height:64px;border-radius:20px;background:#B4525E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" stroke="#FAF2EC" stroke-width="3.5" fill="none"/></svg></div>
 <span class="tx" id="w3">Dermapen</span><span class="key" style="margin-left:auto">↵</span></div></div>
<!-- 5 toast -->
<div class="it glass" id="i4"><div class="c">
 <div style="width:96px;height:96px;border-radius:28px;background:#B4525E;display:flex;align-items:center;justify-content:center;flex:none"><svg width="52" height="52" viewBox="0 0 56 56"><path id="ck4" d="M14 29 L24 39 L43 18" stroke="#FAF2EC" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <span id="w4" style="display:flex;gap:16px;align-items:baseline;direction:rtl;white-space:nowrap"><span style="font:700 50px/1 P7;color:#3A1219">و</span><span class="tx">Microneedling RF</span></span></div></div>
<svg id="cur" viewBox="0 0 52 64"><path d="M5 5 L5 50 L16 39 L24 57 L32 54 L24 36 L41 36 Z" fill="#2A0E13" stroke="#FAF2EC" stroke-width="3" stroke-linejoin="round"/></svg>
</div></div>
<script>
const D={"open": 22.7, "close": 26.95, "end": 27.55, "cy": 900, "h": 150, "y0": 642, "y1": 673, "items": [{"t": 23.1, "w": 660, "r": 75, "click": 23.28}, {"t": 23.68, "w": 640, "r": 75}, {"t": 24.46, "w": 880, "r": 40, "word": "Fractional Laser"}, {"t": 25.42, "w": 620, "r": 40}, {"t": 25.95, "w": 860, "r": 40}], "check0": 23.6, "typ": 0.7, "clicks": [[23.200000000000003, 23.28], [23.78, 23.86], [24.560000000000002, 24.64], [25.520000000000003, 25.6], [26.05, 26.13]], "cin": [1180, 1500], "sc": 0.66, "dx": 50, "dy": 310}, pre=3/25;
function spr(t,Ts){ if(t<=0) return 0; const z=0.82,w=4/(z*Ts),wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function spx(t,Ts){ if(t<=0) return 0; const w=5.8/Ts; return 1-(1+w*t)*Math.exp(-w*t); }
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), $=id=>document.getElementById(id);
const O=D.open, C=D.close, CY=D.cy, H=D.h, GAP=26, N=D.items.length;
const IT=D.items.map((o,i)=>({...o,e:$('i'+i)}));
function draw(p,t,t0,Ts){ const L=p.getTotalLength(), s=cl(spr(t-t0,Ts||.3),0,1); p.style.strokeDasharray=`${(L*s).toFixed(1)} ${L+1}`; p.style.opacity=s>0.003?1:0; }
// stack layout: when item n arrives the whole stack re-centres (sum of springs, pure function of time)
const topFor=n=>CY-(n*H+(n-1)*GAP)/2;
function stackTop(t){ let v=topFor(1); for(let n=2;n<=N;n++) v+=(topFor(n)-topFor(n-1))*spr(t-(IT[n-1].t-pre-0.1),.42); return v; }
function press(t){ let p=0; D.clicks.forEach(([a,b])=>{ p+=spr(t-a,.10)-spr(t-b,.14); }); return cl(p,0,1); }
// cursor goes to each new item as it lands, clicks it
function curPos(t){ let x=D.cin[0], y=D.cin[1];
  const keys=[[O-0.05,D.cin[0],D.cin[1]]]; IT.forEach((o,i)=>{ const ty=topFor(i+1)+i*(H+GAP)+H*0.62; keys.push([o.t-0.35,540+o.w/2-90,ty]); }); keys.push([C-0.6,1180,1500]);
  for(let i=1;i<keys.length;i++){ const s=spr(t-keys[i][0],.38); x+=(keys[i][1]-keys[i-1][1])*s; y+=(keys[i][2]-keys[i-1][2])*s; } return {x,y}; }
function seek(t){
  const hv=(t<O-0.04||t>D.end)?'hidden':'visible'; $('cam').style.visibility=hv;
  const u=Math.max(0,Math.min(t,C)-O); $('cam').style.transform=`translate(${(D.dx+4*Math.sin(u*.7)).toFixed(2)}px,${(D.dy+5*Math.sin(u*.9)).toFixed(2)}px) scale(${(D.sc*(1+0.004*u)).toFixed(4)})`;
  const k=spx(t-C,.34), top=stackTop(t);
  IT.forEach((o,i)=>{ const e=o.e, ta=o.t-pre;
    // each item grows from a point (width then height), content arrives with a short blur
    const g=spr(t-ta,.34), gh=spr(t-ta,.26); let w=20+(o.w-20)*g, h=20+(H-20)*gh;
    let cx=540, cy=top+i*(H+GAP)+H/2;
    if(i==0 && t<ta+0.5){ const d=spr(t-(O+0.02),.4); cy=D.y0+(cy-D.y0)*d; }   // first one comes up from the caption
    // close: everything folds into one point that drops back to her lap
    if(k>0){ w=w*(1-k)+20*k; h=h*(1-k)+20*k; cy=cy+(D.y1-cy)*spx(t-C,.26); }
    const pz=1-0.02*(D.clicks[i]?cl(spr(t-D.clicks[i][0],.10)-spr(t-D.clicks[i][1],.14),0,1):0);
    e.style.left=(cx-w*pz/2).toFixed(1)+'px'; e.style.top=(cy-h*pz/2).toFixed(1)+'px'; e.style.width=(w*pz).toFixed(1)+'px'; e.style.height=(h*pz).toFixed(1)+'px';
    e.style.borderRadius=Math.min(o.r,h/2).toFixed(1)+'px';
    e.style.visibility=(t>=ta-0.01 && !(t>C+0.6))?'visible':'hidden'; e.style.opacity=(t>C+0.45? Math.max(0,1-(t-C-0.45)/0.15):1).toFixed(3);
    const a=cl(spr(t-(ta+0.12),.22),0,1)*(1-cl(spx(t-(C-0.02),.16),0,1)), c=e.firstElementChild;
    c.style.opacity=a.toFixed(3); c.style.filter=`blur(${((1-a)*8).toFixed(2)}px)`; c.style.transform=`translateY(${((1-a)*18).toFixed(1)}px)`; });
  // details
  const sp=cl(spr(t-D.items[0].click,.2),0,1)*(1-cl(spr(t-D.check0,.15),0,1)); $('arc').style.opacity=sp.toFixed(3); $('arc').setAttribute('transform',`rotate(${((t-D.items[0].click)*520).toFixed(1)} 32 32)`); draw($('ck0'),t,D.check0,.25);
  draw($('ck1'),t,IT[1].t+0.15,.3); [12,24,36,48].forEach((x,i)=>{ const hh=6+10*Math.abs(Math.sin(t*7+i*1.3)); $('b'+i).setAttribute('d',`M${x} ${30-hh} V${30+hh}`); });
  const s=IT[2].word; $('qt').textContent=s.slice(0,Math.round(s.length*cl((t-(IT[2].t-pre))/D.typ,0,1))); $('caret').style.opacity=(Math.floor(t*2.2)%2==0)?1:0.2;
  draw($('ck4'),t,IT[4].t+0.15,.3);
  const c=curPos(t), cu=$('cur'); cu.style.visibility=(t>O-0.02&&t<C-0.1)?'visible':'hidden';
  cu.style.transform=`translate(${(c.x-5).toFixed(1)}px,${(c.y-5).toFixed(1)}px) scale(${(1-0.14*press(t)).toFixed(3)})`;
}
window.seek=seek;
</script></body></html>
