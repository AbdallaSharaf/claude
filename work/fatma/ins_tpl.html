<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G5;src:url(fonts/Geist600.woff2)}
@font-face{font-family:G7;src:url(fonts/Geist700.woff2)}
@font-face{font-family:P7;src:url(fonts/IBMPA700.ttf)}
html,body{margin:0;background:transparent}
#st{position:relative;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.it{position:absolute;box-sizing:border-box;display:flex;align-items:center;padding:0 30px;overflow:hidden}
.glass{background:rgba(250,242,236,.76);border:1.5px solid rgba(255,248,242,.85);box-shadow:0 1px 0 rgba(255,250,246,.9) inset,0 2px 6px rgba(70,20,28,.10),0 24px 60px rgba(50,14,20,.24)}
.dark{background:rgba(42,14,19,.88);box-shadow:0 24px 60px rgba(40,10,15,.35)}
.c{display:flex;align-items:center;gap:24px;width:100%;direction:rtl}
.tx{display:flex;flex-direction:column;gap:6px;align-items:center;flex:1}
.ln{display:flex;gap:14px;white-space:nowrap;direction:rtl}
.ar{font:700 58px/1.2 P7;color:#3A1219}
.en{font:700 58px/1.2 G7;color:#3A1219;letter-spacing:-.02em}
.dark .ar,.dark .en{color:#FAF2EC}
.ic{flex:none;display:flex;align-items:center;justify-content:center}
.key{border:1.5px solid rgba(58,18,25,.18);border-radius:12px;font:600 30px/1 G5;color:rgba(58,18,25,.55);padding:10px 14px;background:rgba(255,250,246,.6);white-space:nowrap;margin-right:auto}
#cur{position:absolute;left:0;top:0;width:52px;height:64px;transform-origin:5px 5px;filter:drop-shadow(0 6px 10px rgba(40,10,15,.35))}
</style></head><body><div id="st"><div id="cam"><div id="items"></div>
<svg id="cur" viewBox="0 0 52 64"><path d="M5 5 L5 50 L16 39 L24 57 L32 54 L24 36 L41 36 Z" fill="#2A0E13" stroke="#FAF2EC" stroke-width="3" stroke-linejoin="round"/></svg>
</div></div>
<script>
const D=DATA, pre=3/25;
function spr(t,Ts){ if(t<=0) return 0; const z=0.82,w=4/(z*Ts),wd=w*Math.sqrt(1-z*z); return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t)); }
function spx(t,Ts){ if(t<=0) return 0; const w=5.8/Ts; return 1-(1+w*t)*Math.exp(-w*t); }
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)), $=id=>document.getElementById(id), LAT=/[A-Za-z]/;
const O=D.open, C=D.close, CY=D.cy, GAP=24;
const ICON={
 drop:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26 9 C20 18 15 24 15 31 A11 11 0 0 0 37 31 C37 24 32 18 26 9Z"/><path d="M21 32 A5 5 0 0 0 26 37"/></svg></div>`,
 syringe:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M34 9 L43 18"/><path d="M38.5 13.5 L20 32 L16 28 L34.5 9.5"/><path d="M18 30 L9 39"/><path d="M27 19 L30 22 M23 23 L26 26"/></svg></div>`,
 laser:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26 7 V21"/><path d="M22 17 L26 21 L30 17"/><g stroke-width="4.5"><path d="M15 30 h0 M21 30 h0 M27 30 h0 M33 30 h0 M39 30 h0 M18 37 h0 M24 37 h0 M30 37 h0 M36 37 h0"/></g></svg></div>`,
 pen:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 37 L33 19 L38 24 L20 42 Z"/><path d="M33 19 L37 15 L42 20 L38 24"/><path d="M15 37 L10 42"/></svg></div>`,
 needles:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14 H28"/><path d="M13 14 V32 M19 14 V35 M25 14 V32"/><path d="M39 10 L33 24 H41 L35 40"/></svg></div>`,
 belly:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 7 C16 16 13 22 13 30 C13 40 19 45 26 45 C33 45 39 40 39 30 C39 22 36 16 34 7"/><circle cx="26" cy="31" r="1.8"/></svg></div>`,
 scale:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="10" width="32" height="32" rx="8"/><path d="M18 23 A9 9 0 0 1 34 23"/><path d="M26 23 L29.5 17.5"/></svg></div>`,
 stroller:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 H16 L20 30 H40 A12 12 0 0 0 28 16 V30"/><circle cx="22" cy="38" r="3"/><circle cx="37" cy="38" r="3"/></svg></div>`,
 infoc:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="16"/><path d="M26 23 V35"/><circle cx="26" cy="17" r="1.5" fill="#FAF2EC"/></svg></div>`,
 asym:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 27 C13 19 19 17 23 21 C25 19 27 19 29 21 C33 17 39 19 44 27" /><path d="M8 27 Q26 31 44 27" /><path d="M8 27 C15 39 37 39 44 27" /><path d="M26 11 V43" stroke-dasharray="3 3.5"/></svg></div>`,
 gummy:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20 Q26 16 44 20" /><path d="M8 20 Q26 26 44 20" /><path d="M10 22 Q26 44 42 22" /><path d="M18 24 V31 M26 25 V33 M34 24 V31" /></svg></div>`,
 inward:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(6 6) scale(0.77)"><path d="M8 27 C13 19 19 17 23 21 C25 19 27 19 29 21 C33 17 39 19 44 27" /><path d="M8 27 Q26 31 44 27" /><path d="M8 27 C15 39 37 39 44 27" /></g><path d="M3 26 H9 M6.5 23.5 L9 26 L6.5 28.5 M49 26 H43 M45.5 23.5 L43 26 L45.5 28.5"/></svg></div>`,
 updown:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="80" height="80" viewBox="1 1 50 50" fill="none" stroke="#FAF2EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(6 9) scale(0.77)"><path d="M8 27 C13 19 19 17 23 21 C25 19 27 19 29 21 C33 17 39 19 44 27" /><path d="M8 27 Q26 31 44 27" /><path d="M8 27 C15 39 37 39 44 27" /></g><path d="M26 3 V10 M23 6 L26 3 L29 6 M26 49 V42 M23 46 L26 49 L29 46"/></svg></div>`,
 num:n=>`<div class="ic" style="width:96px;height:96px;border-radius:28px;background:#B4525E;color:#FAF2EC;font:700 52px/96px P7;text-align:center">${n}</div>`,
 check:()=>`<div class="ic" style="width:96px;height:96px;border-radius:48px;background:#B4525E"><svg width="52" height="52" viewBox="0 0 64 64"><path class="ck" d="M16 33 L27 44 L48 21" stroke="#FAF2EC" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`,
 mag:()=>`<div class="ic"><svg width="60" height="60" viewBox="0 0 60 60"><circle cx="26" cy="26" r="16" stroke="#3A1219" stroke-width="3.5" fill="none"/><path d="M38 38 L50 50" stroke="#3A1219" stroke-width="3.5" stroke-linecap="round"/></svg></div>`,
 dot:()=>`<div class="ic" style="width:64px;height:64px;border-radius:20px;background:#B4525E"><svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" stroke="#FAF2EC" stroke-width="3.5" fill="none"/></svg></div>`,
 info:()=>`<div class="ic" style="width:96px;height:96px;border-radius:28px;background:#B4525E"><svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="19" stroke="#FAF2EC" stroke-width="4" fill="none"/><path d="M26 23 V36" stroke="#FAF2EC" stroke-width="4.5" stroke-linecap="round"/><circle cx="26" cy="16" r="2.8" fill="#FAF2EC"/></svg></div>`};
const IT=D.items.map((o,i)=>{ const e=document.createElement('div'); e.className='it '+(o.dark?'dark':'glass'); $('items').appendChild(e);
  const c=document.createElement('div'); c.className='c'; e.appendChild(c);
  c.insertAdjacentHTML('beforeend',ICON[o.icon](o.num));
  const tx=document.createElement('div'); tx.className='tx'; c.appendChild(tx);
  const ws=[]; o.lines.forEach(L=>{ const ln=document.createElement('div'); ln.className='ln'; tx.appendChild(ln); if(!L.some(w=>/[\u0621-\u064A]/.test(w.w))) ln.style.direction='ltr';
    if(o.search){ const sp=document.createElement('span'); sp.className='ar'; ln.appendChild(sp); const car=document.createElement('span'); car.style.cssText='display:inline-block;width:4px;height:58px;background:#B4525E;align-self:center'; ln.appendChild(car); ws.push({search:true,el:sp,car,L}); }
    else L.forEach(w=>{ const sp=document.createElement('span'); sp.className=LAT.test(w.w)?'en':'ar'; sp.textContent=w.w; ln.appendChild(sp); ws.push({el:sp,t:w.t}); }); });
  if(o.key) c.insertAdjacentHTML('beforeend',`<span class="key">${o.key}</span>`);
  return {...o,e,c,ws,t:o.lines[0][0].t,h:o.lines.length>1?210:(D.itemH||150)}; });
let TOPS=null;
const NOJOIN='اأإآدذرزوؤةىء ';
function kashida(sp,target){ let s=sp.textContent, guard=0;
  while(sp.getBoundingClientRect().width<target-3 && guard++<60){
    const pos=[]; for(let i=0;i<s.length-1;i++){ const c=s[i], n=s[i+1]; if(NOJOIN.includes(c)||c=='ـ'&&false||n==' '||c==' ') continue; if(/[ء-ي]/.test(c)&&/[ء-يـ]/.test(n)&&!NOJOIN.includes(c)) pos.push(i+1); }
    if(!pos.length) break; const k=pos[guard%pos.length]; s=s.slice(0,k)+'ـ'+s.slice(k); sp.textContent=s; } }
function equalize(){ const lines=IT.map(o=>o.c.querySelector('.ln')); const ws=lines.map(l=>l.getBoundingClientRect().width); const T=Math.max(...ws);
  IT.forEach((o,i)=>{ const ln=lines[i]; if(ws[i]>=T-3||ws[i]<0.62*T) return; const sp=[...ln.children];
    if(sp.some(x=>/[ء-ي]/.test(x.textContent))){ const ar=sp.filter(x=>/[ء-ي]/.test(x.textContent)).sort((a,b)=>b.textContent.length-a.textContent.length);
      let left=T-ln.getBoundingClientRect().width; ar.forEach((x,j)=>{ const share=left/(ar.length-j); const w0=x.getBoundingClientRect().width; kashida(x,w0+share); left-=x.getBoundingClientRect().width-w0; }); }
    else { const n=sp.reduce((a,x)=>a+x.textContent.length,0); sp.forEach(x=>x.style.letterSpacing=Math.min(2.5,(T-ws[i])/n).toFixed(2)+'px'); } }); }
function layout(){ equalize(); TOPS=[]; let y=0; IT.forEach(o=>{ o.ws.forEach(x=>{ if(x.search) x.el.textContent=x.L.map(q=>q.w).join(' '); }); o.w=Math.min(980,o.c.scrollWidth+150); }); if(D.align){ const mw=Math.max(...IT.map(o=>o.w)); IT.forEach(o=>o.w=mw); } IT.forEach((o,i)=>{ o.ws.forEach(x=>{ if(x.search) x.el.textContent=''; }); TOPS.push(y); y+=o.h+GAP; }); }
const total=n=>{ let s=0; for(let i=0;i<n;i++) s+=IT[i].h+(i?GAP:0); return s; };
function stackTop(t){ let v=CY-total(1)/2; for(let n=2;n<=IT.length;n++) v+=((CY-total(n)/2)-(CY-total(n-1)/2))*spr(t-(IT[n-1].t-pre-0.1),.42); return v; }
function press(t){ let p=0; IT.forEach(o=>{ const a=o.t+0.10,b=o.t+0.18; p+=spr(t-a,.10)-spr(t-b,.14); }); return cl(p,0,1); }
function seek(t){
  if(!TOPS) layout();
  const hv=(t<O-0.04||t>D.end)?'hidden':'visible'; $('cam').style.visibility=hv;
  const u=Math.max(0,Math.min(t,C)-O); $('cam').style.transform=`translate(${(D.dx+4*Math.sin(u*.7)).toFixed(2)}px,${(D.dy+5*Math.sin(u*.9)).toFixed(2)}px) scale(${(D.sc*(1+0.004*u)).toFixed(4)})`;
  const k=spx(t-C,D.ck||.34), top=stackTop(t);
  IT.forEach((o,i)=>{ const ta=o.t-pre, g=spr(t-ta,.34), gh=spr(t-ta,.26); let w=20+(o.w-20)*g, h=20+(o.h-20)*gh;
    let cy=top+TOPS[i]+o.h/2; if(i==0 && t<ta+0.5){ cy=D.y0+(cy-D.y0)*spr(t-(O+0.02),.4); }
    if(k>0){ w=w*(1-k)+20*k; h=h*(1-k)+20*k; cy=cy+(D.y1-cy)*spx(t-C,D.cy1||.26); }
    const e=o.e; e.style.left=(540-w/2).toFixed(1)+'px'; e.style.top=(cy-h/2).toFixed(1)+'px'; e.style.width=w.toFixed(1)+'px'; e.style.height=h.toFixed(1)+'px';
    e.style.borderRadius=Math.min(o.r||40,h/2).toFixed(1)+'px'; const FA=D.fa??0.45, FB=D.fb??0.6; e.style.visibility=(t>=ta-0.01&&!(t>C+FB))?'visible':'hidden'; e.style.opacity=(t>C+FA?Math.max(0,1-(t-C-FA)/(FB-FA)):1).toFixed(3);
    const a=cl(spr(t-(ta+0.10),.22),0,1)*(1-cl(spx(t-(C-0.02),.16),0,1)); o.c.style.opacity=a.toFixed(3);
    o.ws.forEach(x=>{ if(x.search){ const L=x.L, s=L.map(q=>q.w).join(' '); let n=0; L.forEach((q,j)=>{ const t0=q.t-pre, t1=j+1<L.length?L[j+1].t-pre:q.t+0.45; const pos=L.slice(0,j).map(z=>z.w.length+1).reduce((p,c)=>p+c,0); n=Math.max(n,Math.round(pos+(q.w.length)*cl((t-t0)/Math.max(0.15,t1-t0),0,1)*(t>=t0?1:0))); }); x.el.textContent=s.slice(0,n); x.car.style.opacity=(Math.floor(t*2.2)%2==0)?1:0.2; }
      else { const b=cl(spr(t-(x.t-pre),.28),0,1); x.el.style.opacity=b.toFixed(3); x.el.style.transform=`translateY(${((1-b)*20).toFixed(1)}px)`; } });
    const ck=o.e.querySelector('.ck'); if(ck){ const L=ck.getTotalLength(), s=cl(spr(t-(ta+0.15),.3),0,1); ck.style.strokeDasharray=`${(L*s).toFixed(1)} ${L+1}`; } });

  // typing on the keyboard clicks: one letter (with its kashida) per click, line grows from the right edge
  IT.forEach(o=>{ if(!o.type) return; const ln=o.c.querySelector('.ln'); const sp=[...ln.children].filter(x=>x.tagName=='SPAN'&&!x.classList.contains('car'));
    if(!o.fin){ o.fin=sp.map(x=>x.textContent); o.lw=ln.getBoundingClientRect().width; ln.style.minWidth=o.lw+'px'; ln.style.justifyContent='flex-start';
      o.car=document.createElement('span'); o.car.className='car'; o.car.style.cssText='display:inline-block;width:4px;height:58px;background:#B4525E;align-self:center;border-radius:2px'; ln.appendChild(o.car); }
    let last=0;
    sp.forEach((x,j)=>{ const f=o.fin[j], units=[]; for(const ch of f){ if(ch=='ـ'&&units.length) units[units.length-1]+=ch; else units.push(ch); }
      const C=o.type[j]; let n=0; units.forEach((u,k)=>{ const tk=C[Math.min(C.length-1,Math.floor(k*C.length/units.length))]; if(t>=tk) n=k+1; });
      x.textContent=units.slice(0,n).join(''); x.style.opacity=n?1:0; x.style.transform='none'; x.style.display=n?'inline-block':'none'; last=Math.max(last,C[C.length-1]); });
    const typing=t>=o.type[0][0]-0.15 && t<last+0.45; o.car.style.display=typing?'inline-block':'none'; o.car.style.opacity=(Math.floor(t*4)%2==0)?1:0.25; });
  // cursor visits each new item as it lands
  let x=1180,y=1500; const keys=[[O-0.05,1180,1500]]; IT.forEach((o,i)=>keys.push([o.t-0.35,540+o.w/2-70,(CY-total(i+1)/2)+TOPS[i]+o.h*0.62])); keys.push([C-0.6,1180,1500]);
  for(let i=1;i<keys.length;i++){ const s=spr(t-keys[i][0],.38); x+=(keys[i][1]-keys[i-1][1])*s; y+=(keys[i][2]-keys[i-1][2])*s; }
  const cu=$('cur'); cu.style.visibility=(t>O-0.02&&t<C-0.1)?'visible':'hidden'; cu.style.transform=`translate(${(x-5).toFixed(1)}px,${(y-5).toFixed(1)}px) scale(${(1-0.14*press(t)).toFixed(3)})`;
}
window.seek=seek;
</script></body></html>
